<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <foreignObject width="1000" height="300">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .wrap {
          position: relative; width: 1000px; height: 300px; overflow: hidden;
          border-radius: 20px; background: #07090f; color: #e6edf3;
          font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
          padding: 0 64px; display: flex; flex-direction: column; justify-content: center;
        }
        .grid {
          position: absolute; inset: 0;
          background-image:
            linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
          background-size: 40px 40px;
          -webkit-mask-image: radial-gradient(ellipse at 70% 50%, #000 10%, transparent 70%);
          mask-image: radial-gradient(ellipse at 70% 50%, #000 10%, transparent 70%);
        }
        .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }
        .b1 { width: 360px; height: 360px; background: #7c3aed; left: -80px; top: -140px; animation: drift 16s ease-in-out infinite alternate; }
        .b2 { width: 320px; height: 320px; background: #0891b2; right: 80px; bottom: -160px; animation: drift 13s ease-in-out infinite alternate-reverse; }
        .b3 { width: 220px; height: 220px; background: #db2777; right: -40px; top: -60px; opacity: .35; animation: drift 19s ease-in-out infinite alternate; }
        @keyframes drift { to { transform: translate(90px, 50px) scale(1.15); } }

        .orbit { position: absolute; right: 170px; top: 50%; width: 0; height: 0; }
        .ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(255,255,255,.16); animation: spin linear infinite; }
        .ring i { position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; }
        .r1 { width: 120px; height: 120px; margin: -60px; animation-duration: 8s; }
        .r1 i { background: #22d3ee; box-shadow: 0 0 14px #22d3ee; }
        .r2 { width: 200px; height: 200px; margin: -100px; animation-duration: 14s; animation-direction: reverse; }
        .r2 i { background: #a78bfa; box-shadow: 0 0 14px #a78bfa; }
        .r3 { width: 280px; height: 280px; margin: -140px; animation-duration: 22s; border-style: solid; border-color: rgba(255,255,255,.07); }
        .r3 i { background: #f472b6; box-shadow: 0 0 14px #f472b6; }
        .core {
          position: absolute; width: 44px; height: 44px; margin: -22px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #fff, #a78bfa 45%, #4c1d95);
          box-shadow: 0 0 40px rgba(167,139,250,.7); animation: pulse 3s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 60px rgba(167,139,250,.9); } }

        .content { position: relative; }
        .hi { font-size: 20px; color: #8b949e; letter-spacing: .5px; opacity: 0; animation: rise .8s .2s ease-out forwards; }
        .name {
          font-size: 92px; font-weight: 800; letter-spacing: -3px; line-height: 1.05;
          background: linear-gradient(90deg, #a78bfa, #22d3ee, #34d399, #f472b6, #a78bfa);
          background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
          opacity: 0; animation: rise .9s .4s ease-out forwards, shine 8s linear infinite;
        }
        .line { display: flex; gap: 10px; font-size: 26px; font-weight: 600; height: 36px; margin-top: 6px; opacity: 0; animation: rise .8s .8s ease-out forwards; }
        .words { height: 36px; overflow: hidden; }
        .words ul { list-style: none; animation: roll 12s cubic-bezier(.7,0,.3,1) 1.6s infinite; }
        .words li { height: 36px; line-height: 36px; color: #22d3ee; }
        .words li:nth-child(2) { color: #a78bfa; }
        .words li:nth-child(3) { color: #34d399; }
        .words li:nth-child(4) { color: #f472b6; }
        @keyframes roll {
          0%, 20% { transform: translateY(0); }
          25%, 45% { transform: translateY(-36px); }
          50%, 70% { transform: translateY(-72px); }
          75%, 95% { transform: translateY(-108px); }
          100% { transform: translateY(-144px); }
        }
        .pills { display: flex; gap: 10px; margin-top: 26px; opacity: 0; animation: rise .8s 1.2s ease-out forwards; }
        .pill {
          font-size: 14px; padding: 6px 14px; border-radius: 999px; color: #c9d1d9;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
        }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @keyframes shine { to { background-position: 300% 0; } }

        @media (prefers-reduced-motion: reduce) {
          *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        }
      </style>

      <div class="grid"></div>
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="orbit">
        <div class="ring r3"><i></i></div>
        <div class="ring r2"><i></i></div>
        <div class="ring r1"><i></i></div>
        <div class="core"></div>
      </div>

      <div class="content">
        <p class="hi">Hey there, I'm</p>
        <h1 class="name">Yasser</h1>
        <div class="line">
          <span>Full-stack developer &amp; team lead. I build</span>
          <div class="words">
            <ul>
              <li>healthcare systems</li>
              <li>point-of-sale apps</li>
              <li>ERP add-ons on Frappe</li>
              <li>tools for AI agents</li>
              <li>healthcare systems</li>
            </ul>
          </div>
        </div>
        <div class="pills">
          <span class="pill">TypeScript</span>
          <span class="pill">Next.js</span>
          <span class="pill">NestJS</span>
          <span class="pill">Python</span>
          <span class="pill">Frappe</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
